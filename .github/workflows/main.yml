name: Build TF650 App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.0

      - name: Przygotuj projekt Flutter
        run: |
          # 1. Zabezpiecz Twój kod źródłowy
          mkdir -p /tmp/my_code
          cp -r lib /tmp/my_code/ || true

          # 2. Wygeneruj strukturę projektu w bieżącym katalogu
          flutter create --platforms=android --project-name tf650_app --force .

          # 3. Przywróć Twój oryginalny kod do lib/
          if [ -d /tmp/my_code/lib ]; then
            cp -r /tmp/my_code/lib/* lib/
          fi

      - name: Pobierz zależności
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: tf650-apk
          path: build/app/outputs/flutter-apk/app-release.apk
