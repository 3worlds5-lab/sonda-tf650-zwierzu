name: Build TF650 App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.0

      - name: Utworz platformy bez nadpisywania kodu
        run: |
          if [ ! -d android ]; then
            # Tworzymy tymczasowy projekt, aby wyciągnąć z niego tylko folder android/
            flutter create --platforms=android --project-name tf650_app temp_app
            cp -r temp_app/android ./android
            rm -rf temp_app
          fi

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: tf650-apk
          path: build/app/outputs/flutter-apk/*.apk
